<div id="campaign-map-container" class="hidden" aria-hidden="true">
    <div id="map-header"><span>Campaign</span><span id="map-status"></span></div>
    <div id="campaign-map-stage">
        <svg id="campaign-map-svg" preserveAspectRatio="xMidYMid meet">
            <rect id="map-sea" x="0" y="0" width="100%" height="100%"></rect>
            <g id="land-layer"></g>
            <g id="coastline-layer"></g>
            <g id="settlement-markers"></g>
            <g id="settlement-labels"></g>
            <g id="hero-markers"></g>
        </svg>
    </div>
</div>
