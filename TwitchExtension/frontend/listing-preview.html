<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BLTredone — listing preview</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101b25;color:#e9dab7;font:14px system-ui,sans-serif}
    iframe{display:block;width:100%;height:calc(100% - 42px);border:0;background:radial-gradient(ellipse at 50% 45%,#31414d,#101b25 72%)}
    footer{height:42px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-top:1px solid #47515a;background:#0c141c}
    strong{letter-spacing:.08em;color:#edc16b} span{font-size:12px;color:#aeb8bd}
  </style>
</head>
<body>
  <iframe id="preview" title="BLTredone interactive overlay"></iframe>
  <footer><strong>BLTredone</strong><span>Interface preview · Sample campaign data · Video backdrop omitted</span></footer>
  <script>
    const mode = new URLSearchParams(location.search).get('mode');
    document.getElementById('preview').src = mode === 'battle' ? '/?locale=en' : '/?mission=inactive&locale=en';
  </script>
</body>
</html>
