services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: blt
      POSTGRES_USER: blt
      POSTGRES_PASSWORD: blt-development-only
    ports: ["5432:5432"]
    volumes: ["blt-postgres:/var/lib/postgresql/data"]
  service:
    build: ./BLT.ExtensionService
    depends_on: [postgres]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      BLT_DATABASE: Host=postgres;Port=5432;Database=blt;Username=blt;Password=blt-development-only
      BLT_ALLOW_DEVELOPMENT_AUTH: "true"
      TWITCH_EXTENSION_SECRET: ${TWITCH_EXTENSION_SECRET:-}
    ports: ["5188:8080"]
volumes:
  blt-postgres:
